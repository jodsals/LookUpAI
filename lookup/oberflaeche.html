<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LookUpAI – Suche</title>
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f7f7fb;
      --bg-tint: #eef2ff;
      --card: #ffffff;
      --text: #1f2937;
      --subtle: #6b7280;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --border: #e5e7eb;
      --success: #065f46;
      --error: #b91c1c;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial;
      background:
        radial-gradient(1200px 600px at 50% -10%, var(--bg) 0%, var(--bg-soft) 55%, var(--bg-tint) 100%);
      background-attachment: fixed;
    }
    .wrap { max-width: 720px; margin: 40px auto; padding: 0 16px; }

    .header { margin-bottom: 16px; text-align: center; position: relative; }
    .logo {
      display: block;
      width: 180px;
      height: auto;
      margin: 0 auto 18px;
      filter: drop-shadow(0 6px 16px rgba(0,0,0,.08)) drop-shadow(0 1px 2px rgba(0,0,0,.05));
    }
    .sub { color: var(--subtle); font-size: 14px; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .pad { padding: 18px; }
    .grid { display: grid; gap: 12px; grid-template-columns: 1fr; }
    @media (min-width: 640px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
    label { display: block; font-size: 14px; margin-bottom: 6px; }
    input[type="text"] { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none; background: #fff; }
    input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .btn {
      appearance: none; border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 600; font-size: 14px;
      color: #fff; background: var(--primary); cursor: pointer; box-shadow: 0 1px 2px rgba(0,0,0,0.08);
      transition: background .15s ease, transform .05s ease;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:active { transform: translateY(1px); }
    .btn[disabled] { background: #c7c9d3; cursor: not-allowed; }
    .hint { color: var(--subtle); font-size: 12px; margin-top: 6px; }
    .status { margin-top: 14px; font-size: 14px; }
    .ok { color: var(--success); }
    .err { color: var(--error); }

    .result { margin-top: 16px; }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--border); color: var(--subtle); }

    .facts { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
    .fact { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; background:#fff; }

    .bio { margin-top: 8px; font-size: 14px; line-height: 1.55; color: #111827; }
    .bio p { margin: 0 0 10px; }
    pre { white-space: pre-wrap; font-size: 12px; color: #374151; background: #f9fafb; border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
    .links { margin-top: 8px; font-size: 13px; }
    .links a { color: var(--primary); text-decoration: none; }
    .links a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <img src="logo.png" alt="LookUpAI Logo" class="logo" />
      <p class="sub">A consistent and up-to-date list of facts about businesspeople</p>
    </div>

    <form id="lookupForm" class="card pad" novalidate>
      <div class="grid grid-2">
        <div>
          <label for="lastName">Nachname *</label>
          <input id="lastName" name="lastName" type="text" placeholder="z. B. Maier" required />
        </div>
        <div>
          <label for="firstName">Vorname *</label>
          <input id="firstName" name="firstName" type="text" placeholder="z. B. Alfred" required />
        </div>
        <div style="grid-column: 1 / -1;">
          <label for="hint">Optionaler Suchhinweis</label>
          <input id="hint" name="hint" type="text" placeholder="Firma, Ort, Alias … (optional)" />
          <div class="hint">Vor- & Nachname sind Pflicht. Der Hinweis verbessert die Treffergenauigkeit (z. B. „HP“, „Berlin“, „CTO“).</div>
        </div>
      </div>

      <div class="row" style="margin-top:16px;">
        <div class="hint">Bei Klick werden die Angaben an den n8n-Workflow gesendet.</div>
        <button id="submitBtn" class="btn" type="submit">Suche starten</button>
      </div>

      <div id="status" class="status" aria-live="polite"></div>

      <div id="result" class="result" hidden>
        <div class="card pad">
          <div class="row-between">
            <h2 style="margin:0;font-size:16px;">Gefundene Person</h2>
            <span id="confidence" class="badge">Confidence: –</span>
          </div>
          <div id="canonicalName" style="margin-top:6px;font-size:14px;"></div>

          <!-- NEU: Kurzprofil -->
          <div id="shortBio" class="bio" hidden></div>

          <!-- Optional: Links (z.B. Wikipedia) -->
          <div id="links" class="links" hidden></div>

          <ul id="facts" class="facts"></ul>
          <div id="raw" style="margin-top:12px;"></div>
        </div>
      </div>
    </form>
  </div>

  <script>
    const N8N_WEBHOOK_URL = "http://localhost:5678/webhook/start";

    const form = document.getElementById('lookupForm');
    const btn  = document.getElementById('submitBtn');
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const nameEl = document.getElementById('canonicalName');
    const confEl = document.getElementById('confidence');
    const factsEl = document.getElementById('facts');
    const rawEl = document.getElementById('raw');
    const shortBioEl = document.getElementById('shortBio');
    const linksEl = document.getElementById('links');

    function setStatus(msg, ok=false) {
      statusEl.textContent = msg;
      statusEl.className = 'status ' + (ok ? 'ok' : 'err');
    }
    const normalize = (s) => (s || '').trim();

    function escapeHtml(s) {
      return String(s)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#39;");
    }

    // einfache Paragraph-Formatierung für LLM/WP-Texte
    function toParagraphs(s) {
      const safe = escapeHtml(s);
      return safe
        .split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const lastName = normalize(document.getElementById('lastName').value);
      const firstName = normalize(document.getElementById('firstName').value);
      const hint = normalize(document.getElementById('hint').value);

      if (!lastName || !firstName) {
        setStatus('Bitte Vor- und Nachname ausfüllen.', false);
        return;
      }

      btn.disabled = true;
      setStatus('Suche läuft …', true);
      resultEl.hidden = true;
      factsEl.innerHTML = '';
      nameEl.textContent = '';
      confEl.textContent = 'Confidence: –';
      rawEl.innerHTML = '';
      shortBioEl.hidden = true;
      shortBioEl.innerHTML = '';
      linksEl.hidden = true;
      linksEl.innerHTML = '';

      const payload = { firstName, lastName, hint: hint || null };

      try {
        const res = await fetch(N8N_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const text = await res.text();
        let data;
        try { data = JSON.parse(text); } catch { data = { raw: text }; }

        if (!res.ok) {
          setStatus(`Fehler ${res.status}: ${res.statusText}`, false);
          rawEl.innerHTML = '<pre>' + (text || 'Keine Details') + '</pre>';
          return;
        }

        const status = data.status || 'ok';
        if (status === 'not_found') {
          setStatus('Keine passende Person gefunden.', false);
          resultEl.hidden = true;
          return;
        }

        setStatus('Ergebnisse geladen.', true);
        resultEl.hidden = false;

        const dn = data?.data?.canonicalName || `${firstName} ${lastName}`;
        const conf = Math.round(((data?.data?.confidence ?? 0) * 100));
        nameEl.textContent = 'Name: ' + dn;
        confEl.textContent = 'Confidence: ' + conf + '%';

        // Kurzbio anzeigen
        const shortBio = data?.data?.shortBio || '';
        if (shortBio) {
          shortBioEl.innerHTML = toParagraphs(shortBio);
          shortBioEl.hidden = false;
        }

        // Optionaler Wikipedia-Link (oder andere Links später)
        const wiki = data?.data?.urls?.wikipedia;
        if (wiki) {
          linksEl.innerHTML = `Quelle: <a href="${escapeHtml(wiki)}" target="_blank" rel="noopener">Wikipedia</a>`;
          linksEl.hidden = false;
        }

        // Facts rendern
        const facts = Array.isArray(data?.data?.facts) ? data.data.facts : [];
        factsEl.innerHTML = facts.length
          ? facts.map(f => `
            <li class="fact">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
                <div>
                  <div style="font-weight:600;">${escapeHtml(f.key || '')}</div>
                  <div>${escapeHtml(f.value || '')}</div>
                </div>
                ${f.source ? `<span class="badge">Quelle: ${escapeHtml(f.source)}</span>` : ''}
              </div>
            </li>`).join('')
          : '';

        // Debug, falls Format mal anders ist
        if (!data.status || !data.data) {
          rawEl.innerHTML = '<div class="hint">Unerwartetes Antwortformat:</div><pre>' + escapeHtml(text) + '</pre>';
        }
      } catch (err) {
        setStatus('Netzwerk-/CORS-Fehler: ' + (err?.message || err), false);
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
